name: AI Interviewer CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  schema-checks:
    name: PostgreSQL migration and repository checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: techvera_test
          POSTGRES_USER: techvera_test
          POSTGRES_PASSWORD: techvera_local_fixture
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U techvera_test -d techvera_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: ./backend/package-lock.json
    - run: npm ci
    - run: npm run test:schema

  backend-checks:
    name: Backend Node.js Checks
    runs-on: windows-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: "./backend/package-lock.json"

    - name: Install NPM dependencies
      run: npm ci

    - name: Lint Backend
      run: npm run lint

    - name: Typecheck Backend
      run: npm run typecheck

    - name: Run Backend Tests
      run: npm test

    - name: Build Backend
      run: npm run build

  frontend-checks:
    name: Frontend React Checks
    runs-on: windows-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: "./frontend/package-lock.json"

    - name: Install NPM dependencies
      run: npm ci

    - name: Lint Frontend
      run: npm run lint

    - name: Typecheck Frontend
      run: npm run typecheck

    - name: Run Frontend Tests
      run: npm run test

    - name: Build Frontend
      run: npm run build

  ai-service-checks:
    name: Python AI Service Checks
    runs-on: windows-latest
    
    defaults:
      run:
        working-directory: ./ai-service

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        cache-dependency-path: "./ai-service/requirements.txt"

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Ruff
      run: |
        ruff check . --select=E9,F63,F7,F82
        ruff check . --exit-zero

    - name: Run Pytest
      run: |
        python -m pytest tests/
